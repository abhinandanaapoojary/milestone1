# Optional: run PostgreSQL in Docker instead of installing it locally.
# Usage: docker compose up -d db
services:
  db:
    image: postgres:16
    container_name: form_builder_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password_here}
      POSTGRES_DB: ${DB_NAME:-form_builder}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
